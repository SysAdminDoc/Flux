app-id: com.sysadmindoc.FluxTorrent
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: flux-torrent

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home

modules:
  - name: flux-torrent
    buildsystem: simple
    build-commands:
      - install -d /app/lib/flux-torrent
      - cp -a . /app/lib/flux-torrent/
      - install -Dm755 flatpak-launcher /app/bin/flux-torrent
      - install -Dm644 flux-torrent.desktop /app/share/applications/com.sysadmindoc.FluxTorrent.desktop
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/com.sysadmindoc.FluxTorrent.png
    sources:
      - type: dir
        path: ../../dist/FluxTorrent
      - type: file
        path: flatpak-launcher
      - type: file
        path: flux-torrent.desktop
      - type: file
        path: icon.png
